kind = "web"
previewPath = "/"
title = "دليل موردي المخابز والحلويات"
description = "دليل معلوماتي عربي متجاوب لأصحاب المخابز والكافيهات للبحث عن موردي المواد الأولية، استعراض المنتجات ومقارنتها، وإضافة تقييمات والتواصل المباشر عبر الهاتف وواتساب."
version = "1.0.0"
id = "artifacts/bakery-suppliers"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25514

[services.development]
run = "pnpm --filter @workspace/bakery-suppliers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bakery-suppliers", "run", "build" ]
serve = "static"
publicDir = "artifacts/bakery-suppliers/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25514"
BASE_PATH = "/"
