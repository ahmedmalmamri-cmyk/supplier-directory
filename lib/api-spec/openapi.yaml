openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: واجهة دليل موردي المخابز والحلويات
servers:
  - url: /api
tags:
  - name: health
  - name: directory
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHome
      tags: [directory]
      responses:
        "200":
          description: Home page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
  /search:
    get:
      operationId: searchDirectory
      tags: [directory]
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /categories/{id}:
    get:
      operationId: fetchCategory
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: rating
          schema: { type: number }
        - in: query
          name: minOrder
          schema: { type: integer }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, rating, alphabetical] }
      responses:
        "200":
          description: Category details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "404": { description: Not found }
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [directory]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: verified
          schema: { type: boolean }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, rating, alphabetical] }
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Supplier" }
  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Supplier details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierDetail"
        "404": { description: Not found }
  /suppliers/{id}/reviews:
    post:
      operationId: addReview
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400": { description: Invalid review }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404": { description: Not found }
  /contact:
    post:
      operationId: sendContact
      tags: [directory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /register:
    post:
      operationId: registerInterest
      tags: [directory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration interest saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400": { description: Invalid registration }
  /buyer/register:
    post:
      operationId: registerBuyer
      tags: [buyer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerRegisterInput"
      responses:
        "201":
          description: Buyer account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerAuthResponse"
        "400": { description: Invalid registration }
        "409": { description: Phone or email already used }
  /buyer/login:
    post:
      operationId: loginBuyer
      tags: [buyer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerLoginInput"
      responses:
        "200":
          description: Buyer session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerAuthResponse"
        "401": { description: Invalid credentials }
  /buyer/logout:
    post:
      operationId: logoutBuyer
      tags: [buyer]
      responses:
        "200":
          description: Buyer session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicSuccessResponse"
  /buyer/me:
    get:
      operationId: getBuyerMe
      tags: [buyer]
      responses:
        "200":
          description: Current buyer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerMeResponse"
        "401": { description: Buyer authentication required }
  /buyer/contact:
    post:
      operationId: createBuyerContactLog
      tags: [buyer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerContactInput"
      responses:
        "201":
          description: Contact log created and WhatsApp URL prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerContactResponse"
        "400": { description: Invalid contact input }
        "401": { description: Buyer authentication required }
        "404": { description: Supplier not found }
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Invalid credentials }
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      responses:
        "200":
          description: Admin session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
  /admin/registrations:
    get:
      operationId: listRegistrationInterests
      tags: [admin]
      responses:
        "200":
          description: Registration requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationInterestList"
        "401": { description: Admin authentication required }
  /admin/registrations/{id}/approve:
    post:
      operationId: approveRegistration
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registration approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Admin authentication required }
        "404": { description: Registration not found }
  /admin/registrations/{id}/reject:
    post:
      operationId: rejectRegistration
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registration rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Admin authentication required }
        "404": { description: Registration not found }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Category:
      type: object
      required: [id, name, icon, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string }
        slug: { type: string }
        productCount: { type: integer }
    Supplier:
      type: object
      required: [id, name, city, region, description, phone, whatsapp, isVerified, averageRating, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        region: { type: string }
        description: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        isVerified: { type: boolean }
        averageRating: { type: number }
        createdAt: { type: string }
        productCount: { type: integer }
    Product:
      type: object
      required: [id, supplierId, supplierName, categoryId, categoryName, name, weight, unit, countryOfOrigin, minOrder, createdAt]
      properties:
        id: { type: integer }
        supplierId: { type: integer }
        supplierName: { type: string }
        categoryId: { type: integer }
        categoryName: { type: string }
        name: { type: string }
        weight: { type: string }
        unit: { type: string }
        countryOfOrigin: { type: string }
        minOrder: { type: integer }
        price: { type: [number, "null"] }
        imageUrl: { type: [string, "null"] }
        createdAt: { type: string }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [ingredients, technicalData, recommendedUse, shelfLife, storageConditions, supplier, similarProducts]
          properties:
            ingredients: { type: string }
            technicalData: { type: string }
            recommendedUse: { type: string }
            shelfLife: { type: string }
            storageConditions: { type: string }
            supplier: { $ref: "#/components/schemas/Supplier" }
            similarProducts:
              type: array
              items: { $ref: "#/components/schemas/Product" }
    Review:
      type: object
      required: [id, supplierId, reviewerName, rating, comment, createdAt]
      properties:
        id: { type: integer }
        supplierId: { type: integer }
        reviewerName: { type: string }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string }
    ReviewInput:
      type: object
      required: [reviewerName, rating, comment]
      properties:
        reviewerName: { type: string, minLength: 2, maxLength: 80 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 3, maxLength: 500 }
    SupplierDetail:
      allOf:
        - $ref: "#/components/schemas/Supplier"
        - type: object
          required: [products, reviews]
          properties:
            products:
              type: array
              items: { $ref: "#/components/schemas/Product" }
            reviews:
              type: array
              items: { $ref: "#/components/schemas/Review" }
    HomeData:
      type: object
      required: [categories, featuredSuppliers, latestProducts, stats]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        featuredSuppliers:
          type: array
          items: { $ref: "#/components/schemas/Supplier" }
        latestProducts:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        stats:
          $ref: "#/components/schemas/Stats"
    Stats:
      type: object
      required: [suppliers, products, cities, reviews]
      properties:
        suppliers: { type: integer }
        products: { type: integer }
        cities: { type: integer }
        reviews: { type: integer }
    SearchResults:
      type: object
      required: [suppliers, products]
      properties:
        suppliers:
          type: array
          items: { $ref: "#/components/schemas/Supplier" }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
    CategoryDetail:
      type: object
      required: [category, suppliers, products, cities]
      properties:
        category: { $ref: "#/components/schemas/Category" }
        suppliers:
          type: array
          items: { $ref: "#/components/schemas/Supplier" }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        cities:
          type: array
          items: { type: string }
    ContactInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        subject: { type: string, minLength: 2, maxLength: 120 }
        message: { type: string, minLength: 5, maxLength: 1000 }
    ContactResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    RegisterInput:
      type: object
      required: [name, email, region]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        region: { type: string, enum: ["المنطقة الشرقية"] }
    RegisterResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    BuyerUser:
      type: object
      required: [id, fullName, phone, email, city, businessType, businessName, otherBusinessType, isOwner, jobTitle, createdAt, lastLogin]
      properties:
        id: { type: integer }
        fullName: { type: string }
        phone: { type: string }
        email: { type: [string, "null"], format: email }
        city: { type: string }
        businessType: { type: string }
        businessName: { type: [string, "null"] }
        otherBusinessType: { type: [string, "null"] }
        isOwner: { type: boolean }
        jobTitle: { type: [string, "null"] }
        createdAt: { type: string }
        lastLogin: { type: [string, "null"] }
    BuyerRegisterInput:
      type: object
      required: [fullName, phone, city, businessType, isOwner, password]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string }
        email: { type: string, format: email, maxLength: 160 }
        city: { type: string }
        businessType: { type: string, enum: ["مخبز", "محل حلويات", "مخبز وحلويات", "كافيه", "مطعم", "أسرة منتجة", "أسر منتجة", "فندق", "آخر"] }
        businessName: { type: string, maxLength: 120 }
        otherBusinessType: { type: string, maxLength: 80 }
        isOwner: { type: boolean }
        jobTitle: { type: string, maxLength: 80 }
        password: { type: string, minLength: 6, maxLength: 128 }
        newsletterWeekly: { type: boolean }
        buyersGroup: { type: boolean }
    BuyerLoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string, minLength: 1 }
    BuyerAuthResponse:
      type: object
      required: [success, message, user]
      properties:
        success: { type: boolean }
        requestCode: { type: string }
        message: { type: string }
        user: { $ref: "#/components/schemas/BuyerUser" }
    BuyerMeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/BuyerUser" }
    BuyerContactInput:
      type: object
      required: [supplierId]
      properties:
        supplierId: { type: integer }
        message: { type: string, maxLength: 1000 }
    BuyerContactResponse:
      type: object
      required: [success, messageId, message, whatsappUrl]
      properties:
        success: { type: boolean }
        messageId: { type: string }
        message: { type: string }
        whatsappUrl: { type: string, format: uri }
    BasicSuccessResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    RegistrationInterest:
      type: object
      required: [id, name, email, region, status, createdAt, reviewedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        region: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string }
        reviewedAt: { type: [string, "null"] }
    RegistrationInterestList:
      type: array
      items:
        $ref: "#/components/schemas/RegistrationInterest"