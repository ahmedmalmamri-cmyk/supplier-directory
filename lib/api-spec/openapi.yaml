        success: { type: boolean }
        message: { type: string }
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    RegistrationInterest:
      type: object
      required: [id, name, email, region, status, createdAt, reviewedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        region: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string }
        reviewedAt: { type: [string, "null"] }
    RegistrationInterestList:
      type: array
      items:
        $ref: "#/components/schemas/RegistrationInterest"
    SupplierInvitationDraftInput:
      type: object
      required: [name, whatsapp, city]
