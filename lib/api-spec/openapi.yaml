openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: واجهة دليل موردي المخابز والحلويات
servers:
  - url: /api
tags:
  - name: health
  - name: directory
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHome
      tags: [directory]
      responses:
        "200":
          description: Home page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
  /groups:
    get:
      operationId: listGroups
      tags: [directory]
      responses:
        "200":
          description: Active groups and their visible category and supplier counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
  /item-categories:
    get:
      operationId: listItemCategories
      tags: [directory]
      responses:
        "200":
          description: Active supplier categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemCategory" }
  /admin/item-categories:
    get:
      operationId: listAdminItemCategories
      tags: [admin]
      responses:
        "200":
          description: Supplier category tree for administration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminItemCategory" }
        "401": { description: Admin login required }
    post:
      operationId: createAdminItemCategory
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCategoryInput" }
      responses:
        "201":
          description: Created supplier category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminItemCategory" }
        "400": { description: Invalid category or duplicate name }
        "401": { description: Admin login required }
  /admin/groups:
    get:
      operationId: listAdminGroups
      tags: [admin]
      responses:
        "200":
          description: All groups, including inactive groups, for administration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { description: Admin login required }
    post:
      operationId: createAdminGroup
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { description: Invalid group data }
        "401": { description: Admin login required }
        "409": { description: Group name or slug already exists }
  /admin/groups/{id}:
    patch:
      operationId: updateAdminGroup
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdate" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { description: Invalid group data }
        "401": { description: Admin login required }
        "404": { description: Group not found }
        "409": { description: Group name or slug already exists }
    delete:
      operationId: deleteAdminGroup
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted group with no primary categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDeleteResponse" }
        "401": { description: Admin login required }
        "404": { description: Group not found }
        "409": { description: Move primary categories before deleting this group }
  /admin/category-stats:
    get:
      operationId: getAdminCategoryStats
      tags: [admin]
      responses:
        "200":
          description: Live summary of groups, categories, and category tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategoryStats" }
        "401": { description: Admin login required }
  /admin/item-categories/order:
    patch:
      operationId: reorderAdminItemCategories
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCategoryOrderInput" }
      responses:
        "200":
          description: Category order saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCategoryOrderResponse" }
        "400": { description: Invalid sibling order }
        "401": { description: Admin login required }
  /admin/item-categories/{id}:
    patch:
      operationId: updateAdminItemCategory
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCategoryUpdate" }
      responses:
        "200":
          description: Updated supplier category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminItemCategory" }
        "400": { description: Invalid category or duplicate name }
        "401": { description: Admin login required }
        "404": { description: Category not found }
    delete:
      operationId: deleteAdminItemCategory
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Category and its children deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCategoryDeleteResponse" }
        "401": { description: Admin login required }
        "404": { description: Category not found }
  /admin/item-categories/{id}/permanent:
    get:
      operationId: getAdminItemCategoryDeletionPreview
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current dependencies and eligibility for permanent deletion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCategoryDeletionPreview" }
        "401": { description: Admin login required }
        "404": { description: Category not found }
        "409": { description: Supplier selections cannot be inspected safely }
    delete:
      operationId: permanentlyDeleteAdminItemCategory
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Inactive category permanently removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCategoryPermanentDeleteResponse" }
        "400": { description: Category must be inactive before permanent deletion }
        "401": { description: Admin login required }
        "404": { description: Category not found }
        "409": { description: Category has linked records that must be moved or unlinked first }
  /admin/item-categories/{id}/transfer:
    post:
      operationId: transferAdminItemCategory
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCategoryTransferInput" }
      responses:
        "200":
          description: Category transferred without changing supplier selections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminItemCategory" }
        "400": { description: "Invalid destination, name conflict, or category cycle" }
        "401": { description: Admin login required }
        "404": { description: Category not found }
  /admin/item-categories/{id}/tags:
    put:
      operationId: setAdminItemCategoryTags
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCategoryTagsInput" }
      responses:
        "200":
          description: Replaced the category's secondary group tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminItemCategory" }
        "400": { description: Invalid group assignment or primary-group duplication }
        "401": { description: Admin login required }
        "404": { description: Category or group not found }
        "409": { description: Category cannot be tagged in its own primary group }
  /admin/activity-log:
    get:
      operationId: listAdminActivityLog
      tags: [admin]
      responses:
        "200":
          description: Recent category activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityLogEntry" }
        "401": { description: Admin login required }
  /search:
    get:
      operationId: searchDirectory
      tags: [directory]
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /categories/{id}:
    get:
      operationId: fetchCategory
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: rating
          schema: { type: number }
        - in: query
          name: minOrder
          schema: { type: integer }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, rating, alphabetical] }
      responses:
        "200":
          description: Category details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "404": { description: Not found }
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [directory]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: rating
          schema: { type: number, minimum: 1, maximum: 5 }
        - in: query
          name: package
          schema: { type: string, enum: [verified, featured] }
        - in: query
          name: verified
          schema: { type: boolean }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, rating, alphabetical] }
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Supplier" }
  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Supplier details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierDetail"
        "404": { description: Not found }
  /suppliers/{id}/reviews:
    post:
      operationId: addReview
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400": { description: Invalid review }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [directory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404": { description: Not found }
  /contact:
    post:
      operationId: sendContact
      tags: [directory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /register:
    post:
      operationId: registerInterest
      tags: [directory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration interest saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400": { description: Invalid registration }
  /buyer/register:
    post:
      operationId: registerBuyer
      tags: [buyer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerRegisterInput"
      responses:
        "201":
          description: Buyer account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerAuthResponse"
        "400": { description: Invalid registration }
        "409": { description: Phone or email already used }
  /buyer/login:
    post:
      operationId: loginBuyer
      tags: [buyer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerLoginInput"
      responses:
        "200":
          description: Buyer session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerAuthResponse"
        "401": { description: Invalid credentials }
  /supplier/login:
    post:
      operationId: loginSupplier
      tags: [supplier]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierLoginInput" }
      responses:
        "200":
          description: Supplier session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierAuthResponse" }
        "400": { description: Invalid login input }
        "401": { description: Invalid credentials }
  /buyer/logout:
    post:
      operationId: logoutBuyer
      tags: [buyer]
      responses:
        "200":
          description: Buyer session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicSuccessResponse"
  /buyer/me:
    get:
      operationId: getBuyerMe
      tags: [buyer]
      responses:
        "200":
          description: Current buyer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerMeResponse"
        "401": { description: Buyer authentication required }
  /buyer/contact:
    post:
      operationId: createBuyerContactLog
      tags: [buyer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerContactInput"
      responses:
        "201":
          description: Contact log created and WhatsApp URL prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerContactResponse"
        "400": { description: Invalid contact input }
        "401": { description: Buyer authentication required }
        "404": { description: Supplier not found }
  /buyer-invites/{token}:
    get:
      operationId: getBuyerInvitation
      tags: [buyer]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Public buyer invitation details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitationPublic" }
        "404": { description: Invitation is invalid or unavailable }
        "409": { description: Invitation already activated }
  /buyer-invites/{token}/activate:
    post:
      operationId: activateBuyerInvitation
      tags: [buyer]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInvitationActivationInput" }
      responses:
        "201":
          description: Buyer account activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitationActivationResponse" }
        "400": { description: Invalid activation details }
        "404": { description: Invitation is invalid or unavailable }
        "409": { description: "Phone or email already used, or invitation already activated" }
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Invalid credentials }
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      responses:
        "200":
          description: Admin session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
  /admin/registrations:
    get:
      operationId: listRegistrationInterests
      tags: [admin]
      responses:
        "200":
          description: Registration requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationInterestList"
        "401": { description: Admin authentication required }
  /admin/registrations/{id}/approve:
    post:
      operationId: approveRegistration
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registration approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Admin authentication required }
        "404": { description: Registration not found }
  /admin/registrations/{id}/reject:
    post:
      operationId: rejectRegistration
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registration rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Admin authentication required }
        "404": { description: Registration not found }
  /admin/buyer-invitations:
    get:
      operationId: listBuyerInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [invited, activated, active, suspended] }
      responses:
        "200":
          description: Buyer invitations and activated accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuyerInvitation" }
        "401": { description: Admin authentication required }
    post:
      operationId: createBuyerInvitation
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInvitationInput" }
      responses:
        "201":
          description: Buyer invitation draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitation" }
        "400": { description: Invalid invitation details }
        "401": { description: Admin authentication required }
        "409": { description: Phone already has an account or invitation }
  /admin/buyer-invitations/{id}:
    patch:
      operationId: updateBuyerInvitation
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInvitationUpdate" }
      responses:
        "200":
          description: Buyer invitation updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitation" }
        "400": { description: Invalid invitation details }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Activated invitations cannot be edited }
    delete:
      operationId: deleteBuyerInvitation
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unactivated buyer invitation deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Activated invitations cannot be deleted }
  /admin/buyer-invitations/{id}/link:
    post:
      operationId: getBuyerInvitationLink
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stable invitation link and WhatsApp message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitationLink" }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Invitation already activated }
  /admin/buyer-invitations/{id}/sent:
    post:
      operationId: markBuyerInvitationSent
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: WhatsApp opening recorded (delivery is not confirmed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Invitation already activated }
  /admin/buyer-invitations/stats:
    get:
      operationId: getBuyerInvitationStats
      tags: [admin]
      responses:
        "200":
          description: Buyer invitation, search, and contact activity statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitationStats" }
        "401": { description: Admin authentication required }
  /admin/buyer-invitations/export:
    get:
      operationId: exportBuyerInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [invited, activated, active, suspended] }
      responses:
        "200":
          description: Excel-compatible CSV export
          content:
            text/csv:
              schema: { type: string, format: binary }
        "401": { description: Admin authentication required }
  /admin/buyer-invitations/{id}/account-status:
    patch:
      operationId: updateInvitedBuyerAccountStatus
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInvitationAccountStatusInput" }
      responses:
        "200":
          description: Buyer account status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "400": { description: Invalid account status or suspension duration }
        "401": { description: Admin authentication required }
        "404": { description: Activated buyer invitation not found }
  /admin/invitations:
    get:
      operationId: listSupplierInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [unsent, sent, completed] }
      responses:
        "200":
          description: Supplier invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierInvitation" }
        "401": { description: Admin authentication required }
    post:
      operationId: createSupplierInvitationDraft
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInvitationDraftInput" }
      responses:
        "201":
          description: Supplier invitation draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitation" }
        "400": { description: Invalid supplier details }
        "401": { description: Admin authentication required }
  /admin/invitations/stats:
    get:
      operationId: getSupplierInvitationStats
      tags: [admin]
      responses:
        "200":
          description: Supplier invitation statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitationStats" }
        "401": { description: Admin authentication required }
  /admin/invitations/options:
    get:
      operationId: getSupplierInvitationOptions
      tags: [admin]
      responses:
        "200":
          description: City suggestions for supplier invitation forms
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitationOptions" }
        "401": { description: Admin authentication required }
  /admin/suppliers/source-stats:
    get:
      operationId: getSupplierSourceStats
      tags: [admin]
      responses:
        "200":
          description: Supplier counts by creation source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSourceStats" }
        "401": { description: Admin authentication required }
  /admin/invitations/export:
    get:
      operationId: exportSupplierInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [unsent, sent, completed] }
      responses:
        "200":
          description: Excel-compatible CSV export
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400": { description: Invalid invitation status }
        "401": { description: Admin authentication required }
  /admin/suppliers/{id}/invite:
    post:
      operationId: generateSupplierInvitation
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: New invitation link generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitationLink" }
        "401": { description: Admin authentication required }
        "404": { description: Supplier not found }
        "409": { description: Invitation already completed }
  /admin/suppliers/{id}/invite-sent:
    post:
      operationId: markSupplierInvitationSent
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invitation dispatch recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "401": { description: Admin authentication required }
        "404": { description: Supplier invitation not found }
        "409": { description: Invitation cannot be marked as sent }
  /invites/{token}:
    get:
      operationId: getSupplierInvite
      tags: [invitations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Public invitation details and form options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvite" }
        "404": { description: Invitation is invalid or no longer available }
        "409": { description: Invitation already completed }
  /invites/{token}/open:
    post:
      operationId: recordSupplierInviteOpened
      tags: [invitations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Invitation open recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "404": { description: Invitation not found }
        "409": { description: Invitation already completed }
  /invites/{token}/complete:
    post:
      operationId: completeSupplierInvite
      tags: [invitations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInviteInput" }
      responses:
        "201":
          description: Supplier information submitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInviteCompletion" }
        "400": { description: Invalid supplier submission }
        "404": { description: Invitation not found }
        "409": { description: Invitation already completed }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Category:
      type: object
      required: [id, name, icon, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string }
        slug: { type: string }
        productCount: { type: integer }
    Group:
      type: object
      required: [id, name, slug, icon, parentId, displayOrder, isActive, categoryCount, supplierCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        parentId: { type: ["integer", "null"], description: "Null for a root group; otherwise the parent group ID." }
        displayOrder: { type: integer }
        isActive: { type: boolean }
        categoryCount: { type: integer }
        supplierCount: { type: integer }
    GroupInput:
      type: object
      required: [name, icon, displayOrder, isActive]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, minLength: 1, maxLength: 24 }
        displayOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        parentId: { type: ["integer", "null"] }
    GroupUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, minLength: 1, maxLength: 24 }
        displayOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        parentId: { type: ["integer", "null"] }
    GroupDeleteResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    AdminCategoryStats:
      type: object
      required: [groupCount, categoryCount, tagCount, mostTaggedCategory]
      properties:
        groupCount: { type: integer }
        categoryCount: { type: integer }
        tagCount: { type: integer }
        mostTaggedCategory:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/MostTaggedCategory"
    MostTaggedCategory:
      type: object
      required: [id, name, groupCount]
      properties:
        id: { type: integer }
        name: { type: string }
        groupCount: { type: integer }
    ItemCategory:
      type: object
      required: [id, name, icon, slug, groupName, parentId, primaryGroupId, subGroupId, tagGroupIds, description, displayOnHome, displayOrder, isActive, createdAt, updatedAt, supplierCount]
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string }
        slug: { type: string }
        groupName: { type: string }
        parentId: { type: ["integer", "null"] }
        primaryGroupId: { type: ["integer", "null"] }
        subGroupId: { type: ["integer", "null"], description: "Optional subdivision within the primary group." }
        tagGroupIds:
          type: array
          items: { type: integer }
        description: { type: ["string", "null"] }
        displayOnHome: { type: boolean }
        displayOrder: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
        supplierCount: { type: integer }
    AdminItemCategory:
      allOf:
        - $ref: "#/components/schemas/ItemCategory"
        - type: object
          required: [supplierCount]
          properties:
            supplierCount: { type: integer }
    ItemCategoryInput:
      type: object
      required: [name, primaryGroupId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, maxLength: 24, description: "Optional. Blank or omitted uses the default package icon." }
        primaryGroupId: { type: integer }
        parentId: { type: integer, description: "Optional legacy alias for primaryGroupId." }
        subGroupId: { type: ["integer", "null"] }
        description: { type: ["string", "null"], maxLength: 500 }
    ItemCategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, maxLength: 24, description: "Blank selects the default package icon; omission preserves the existing icon." }
        description: { type: ["string", "null"], maxLength: 500 }
        primaryGroupId: { type: integer }
        subGroupId: { type: ["integer", "null"] }
        displayOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        displayOnHome: { type: boolean }
    ItemCategoryTagsInput:
      type: object
      required: [groupIds]
      properties:
        groupIds:
          type: array
          uniqueItems: true
          items: { type: integer }
    ItemCategoryTransferInput:
      type: object
      required: [destinationId, moveSubcategories]
      properties:
        destinationId: { type: ["integer", "null"] }
        moveSubcategories: { type: boolean }
        subGroupId: { type: ["integer", "null"], description: "Destination subdivision; null clears the subdivision." }
    ItemCategoryOrderInput:
      type: object
      required: [parentId, categoryIds]
      properties:
        parentId: { type: ["integer", "null"] }
        categoryIds:
          type: array
          minItems: 1
          items: { type: integer }
    ItemCategoryDeleteResponse:
      type: object
      required: [success, deactivatedCount]
      properties:
        success: { type: boolean }
        deactivatedCount: { type: integer }
    ItemCategoryPermanentDeleteResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    ItemCategoryDeletionPreview:
      type: object
      required: [id, name, isActive, childCategoryCount, supplierLinkCount, aliasCount, requestCount, productCount, canDelete]
      properties:
        id: { type: integer }
        name: { type: string }
        isActive: { type: boolean }
        childCategoryCount: { type: integer }
        supplierLinkCount: { type: integer }
        aliasCount: { type: integer }
        requestCount: { type: integer }
        productCount: { type: integer }
        canDelete: { type: boolean }
    ItemCategoryOrderResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    ActivityLogEntry:
      type: object
      required: [id, adminId, actionType, entityType, entityId, oldValue, newValue, createdAt]
      properties:
        id: { type: integer }
        adminId: { type: integer }
        actionType: { type: string, enum: [add, edit, transfer, delete] }
        entityType: { type: string, enum: [category, supplier, buyer] }
        entityId: { type: integer }
        oldValue: { type: ["object", "null"], additionalProperties: true }
        newValue: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string }
    Supplier:
      type: object
      required: [id, name, city, region, description, hasWhatsApp, address, website, googleCategory, googleRating, googleReviewCount, hoursNote, isVerified, isFeatured, averageRating, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        region: { type: string }
        description: { type: string }
        hasWhatsApp: { type: boolean }
        address: { type: string, nullable: true }
        website: { type: string, nullable: true }
        googleCategory: { type: string, nullable: true }
        googleRating: { type: number, nullable: true }
        googleReviewCount: { type: integer, nullable: true }
        hoursNote: { type: string, nullable: true }
        isVerified: { type: boolean }
        isFeatured: { type: boolean }
        averageRating: { type: number }
        createdAt: { type: string }
        productCount: { type: integer }
    Product:
      type: object
