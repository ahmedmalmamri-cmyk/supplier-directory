openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: واجهة دليل موردي المخابز والحلويات
servers:
  - url: /api
tags:
  - name: health
  - name: directory
  - name: requests
  - name: item-inquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHome
      tags: [directory]
      responses:
        "200":
          description: Home page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
  /groups:
    get:
      operationId: listGroups
      tags: [directory]
      responses:
        "200":
          description: Active groups and their visible category and supplier counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
  /item-categories:
    get:
      operationId: listItemCategories
      tags: [directory]
      responses:
        "200":
          description: Active supplier categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemCategory" }
  /requests/options:
    get:
      operationId: getRequestOptions
      tags: [requests]
      responses:
        "200":
          description: Allowed cities for request publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOptions"
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      parameters:
        - name: categoryId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: city
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - name: q
          in: query
          required: false
          description: Search request title, details, category, business name, or city
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Requests visible to the authenticated buyer or supplier
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Request" }
        "401": { description: Login required }
        "403": { description: Account is not allowed to view requests }
    post:
      operationId: createRequest
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestInput" }
      responses:
        "201":
          description: Request published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { description: Invalid request data or city is unavailable }
        "401": { description: Buyer login required }
        "403": { description: Only active business owners may publish requests }
        "404": { description: Category is unavailable }
  /supplier/requests/{requestId}/contact:
    post:
      operationId: createSupplierRequestContact
      tags: [requests]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Prepared supplier-to-owner WhatsApp message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierRequestContactResponse" }
        "400": { description: Invalid request ID }
        "401": { description: Active supplier login required }
        "404": { description: Request is unavailable }
        "409": { description: A valid WhatsApp number is unavailable }
  /supplier/requests/{requestId}/offer:
    post:
      operationId: createSupplierRequestOfferContact
      tags: [requests]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierRequestOfferInput" }
      responses:
        "200":
          description: Prepared supplier offer WhatsApp message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierRequestContactResponse" }
        "400": { description: Invalid request ID or offer message }
        "401": { description: Active supplier login required }
        "404": { description: Request is unavailable }
        "409": { description: A valid WhatsApp number is unavailable }
  /buyer/item-inquiries/matches:
    get:
      operationId: getBuyerItemInquiryMatches
      tags: [item-inquiries]
      parameters:
        - name: itemId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: city
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Number of active suppliers linked to this item in the selected city
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemInquiryMatchesResponse" }
        "400": { description: Invalid item or city }
        "401": { description: Buyer login required }
  /buyer/item-inquiries:
    get:
      operationId: listBuyerItemInquiries
      tags: [item-inquiries]
      responses:
        "200":
          description: Inquiries created by the authenticated buyer, with supplier replies and no supplier contact details
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuyerItemInquiry" }
        "401": { description: Buyer login required }
    post:
      operationId: createBuyerItemInquiry
      tags: [item-inquiries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerItemInquiryInput" }
      responses:
        "201":
          description: Availability inquiry sent to matching active suppliers; it expires after 14 days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerItemInquiry" }
        "400": { description: "Invalid item, city, or inquiry details" }
        "401": { description: Buyer login required }
        "403": { description: Only active business owners may create availability inquiries }
        "404": { description: Item is unavailable }
        "409": { description: No active suppliers for this item in the selected city }
  /buyer/item-inquiries/{id}/close:
    patch:
      operationId: closeBuyerItemInquiry
      tags: [item-inquiries]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Inquiry closed; suppliers can no longer reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemInquiryCloseResponse" }
        "401": { description: Buyer login required }
        "403": { description: Inquiry does not belong to this buyer }
        "404": { description: Inquiry is unavailable }
  /buyer/item-inquiries/{id}/contact/{supplierId}:
    post:
      operationId: createBuyerItemInquiryContact
      tags: [item-inquiries]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: supplierId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Prepared WhatsApp link for a supplier who replied to this inquiry; contact is logged before returning the link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemInquiryContactResponse" }
        "401": { description: Buyer login required }
        "403": { description: Inquiry does not belong to this buyer }
        "404": { description: Supplier has not replied to this inquiry or is unavailable }
        "409": { description: Supplier WhatsApp number is unavailable }
  /buyer/item-inquiries/photo-upload-url:
    post:
      operationId: createBuyerItemInquiryPhotoUploadUrl
      tags: [item-inquiries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInquiryPhotoUploadInput" }
      responses:
        "200":
          description: Short-lived upload URL and private object path for an optional product/package reference image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemInquiryPhotoUploadResponse" }
        "400": { description: Unsupported image type or file size }
        "401": { description: Buyer login required }
  /supplier/item-inquiries:
    get:
      operationId: listSupplierItemInquiries
      tags: [item-inquiries]
      responses:
        "200":
          description: Active, unexpired availability inquiries sent only to this supplier for linked items in its city; includes buyer business name and this supplier's reply, never buyer contact fields
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierItemInquiry" }
        "401": { description: Active supplier login required }
        "403": { description: Supplier account is not allowed to view inquiries }
  /supplier/item-inquiries/{id}/reply:
    put:
      operationId: upsertSupplierItemInquiryReply
      tags: [item-inquiries]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierItemInquiryReplyInput" }
      responses:
        "200":
          description: Private availability response saved for the matching supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemInquiryReply" }
        "400": { description: "Invalid response status, price, or details" }
        "401": { description: Active supplier login required }
        "403": { description: Inquiry was not sent to this supplier }
        "404": { description: "Inquiry is closed, expired, or unavailable" }
  /item-inquiries/{id}/photo:
    get:
      operationId: getItemInquiryPhoto
      tags: [item-inquiries]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Private reference image, accessible only to its buyer and matching active suppliers
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Login required }
        "403": { description: Account is not authorized to view this image }
        "404": { description: Inquiry or image is unavailable }
  /admin/item-categories:
    get:
      operationId: listAdminItemCategories
      tags: [admin]
      responses:
        "200":
          description: Supplier category tree for administration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminItemCategory" }
        "401": { description: Admin login required }
    post:
      operationId: createAdminItemCategory
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCategoryInput" }
      responses:
        "201":
          description: Created supplier category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminItemCategory" }
        "400": { description: Invalid category or duplicate name }
        "401": { description: Admin login required }
  /admin/supplier-taxonomy/tree:
    get:
      operationId: getAdminSupplierTaxonomyTree
      tags: [admin]
      responses:
        "200":
          description: Proposed independent supplier taxonomy tree
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierTaxonomyNode" }
        "401": { description: Admin login required }
  /admin/supplier-taxonomy/audit:
    get:
      operationId: getAdminSupplierTaxonomyAudit
      tags: [admin]
      responses:
        "200":
          description: Latest 200 audited taxonomy changes without credentials or personally identifiable information
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierTaxonomyAuditEntry" }
        "401": { description: Admin login required }
  /admin/supplier-taxonomy/nodes:
    post:
      operationId: createAdminSupplierTaxonomyNode
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyNodeInput" }
      responses:
        "201":
          description: Created taxonomy node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyNode" }
        "400": { description: Invalid node or parent }
        "401": { description: Admin login required }
        "409": { description: Exact node name already exists }
  /admin/supplier-taxonomy/nodes/bulk:
    post:
      operationId: bulkCreateAdminSupplierTaxonomyNodes
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyBulkInput" }
      responses:
        "201":
          description: Created nodes atomically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierTaxonomyNode" }
        "400": { description: Invalid nodes or parent }
        "401": { description: Admin login required }
        "409": { description: Exact node name already exists }
  /admin/supplier-taxonomy/nodes/{id}:
    patch:
      operationId: updateAdminSupplierTaxonomyNode
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyNodeUpdate" }
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyNode" }
        "400": { description: Invalid node or cyclic move }
        "401": { description: Admin login required }
        "404": { description: Node not found }
        "409": { description: Exact node name already exists }
  /admin/supplier-taxonomy/nodes/{id}/move:
    post:
      operationId: moveAdminSupplierTaxonomyNode
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyMoveInput" }
      responses:
        "200":
          description: Moved node, preserving supplier links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyNode" }
        "400": { description: Cyclic move or invalid parent }
        "401": { description: Admin login required }
        "404": { description: Node not found }
  /admin/supplier-taxonomy/nodes/{id}/delete:
    post:
      operationId: deleteAdminSupplierTaxonomyNode
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyDeleteInput" }
      responses:
        "200":
          description: Deleted categories and their item links without deleting items; primary items receive a replacement category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyDeleteResponse" }
        "400": { description: Missing confirmation or invalid transfer target }
        "409": { description: "Replacement primary category required, supplier link confirmation missing, or duplicate subdivision" }
        "401": { description: Admin login required }
        "404": { description: Node not found }
  /admin/supplier-taxonomy/order:
    put:
      operationId: reorderAdminSupplierTaxonomyNodes
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyOrderInput" }
      responses:
        "200":
          description: Updated sibling display order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "400": { description: Invalid sibling order }
        "401": { description: Admin login required }
  /admin/supplier-taxonomy/items:
    get:
      operationId: listAdminSupplierTaxonomyItems
      tags: [admin]
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: primaryOnly
          in: query
          schema: { type: boolean, default: false }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, inactive], default: all }
      responses:
        "200":
          description: Items with category path, optionally searched or filtered
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierTaxonomyItem" }
        "401": { description: Admin login required }
    post:
      operationId: createAdminSupplierTaxonomyItem
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyItemInput" }
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyItem" }
        "400": { description: Invalid item or category }
        "401": { description: Admin login required }
        "409": { description: Trimmed exact-case item name already exists }
  /admin/supplier-taxonomy/items/bulk:
    post:
      operationId: bulkCreateAdminSupplierTaxonomyItems
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyItemsBulkInput" }
      responses:
        "201":
          description: Created new items and skipped duplicate names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyItemsBulkResponse" }
        "400": { description: Invalid items or category }
        "401": { description: Admin login required }
  /admin/supplier-taxonomy/items/{id}:
    patch:
      operationId: updateAdminSupplierTaxonomyItem
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyItemUpdate" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyItem" }
        "400": { description: Invalid item or category }
        "401": { description: Admin login required }
        "404": { description: Item not found }
        "409": { description: Trimmed exact-case item name already exists }
  /admin/supplier-taxonomy/items/{id}/move:
    post:
      operationId: moveAdminSupplierTaxonomyItem
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyItemMoveInput" }
      responses:
        "200":
          description: Moved item without changing its stable ID or supplier links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyItem" }
        "400": { description: Invalid destination category }
        "401": { description: Admin login required }
        "404": { description: Item not found }
  /admin/supplier-taxonomy/items/{id}/delete:
    post:
      operationId: deleteAdminSupplierTaxonomyItem
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyItemDeleteInput" }
      responses:
        "200":
          description: Deleted confirmed item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "400": { description: Explicit confirmation required }
        "401": { description: Admin login required }
        "404": { description: Item not found }
  /admin/supplier-taxonomy/items/{id}/suppliers:
    put:
      operationId: setAdminSupplierTaxonomyItemSuppliers
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyItemSuppliersInput" }
      responses:
        "200":
          description: Replaced item supplier links after explicit confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyItemSuppliersResponse" }
        "400": { description: Invalid supplier list or missing confirmation }
        "401": { description: Admin login required }
        "404": { description: Item or supplier not found }
  /admin/supplier-taxonomy/items/export.csv:
    get:
      operationId: exportAdminSupplierTaxonomyItemsCsv
      tags: [admin]
      responses:
        "200":
          description: Item list with category paths and supplier links in UTF-8 CSV
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Admin login required }
  /admin/supplier-taxonomy/legacy-import:
    get:
      operationId: previewAdminSupplierTaxonomyLegacyImport
      tags: [admin]
      responses:
        "200":
          description: Preview old item leaves, duplicate names, and unresolved supplier links without changing records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyLegacyImportSummary" }
        "401": { description: Admin login required }
    post:
      operationId: importAdminSupplierTaxonomyLegacyItems
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyLegacyImportConfirmation" }
      responses:
        "200":
          description: Imported only new item names into an inactive temporary section; preserved old records and skipped duplicates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyLegacyImportResult" }
        "400": { description: Explicit confirmation required }
        "401": { description: Admin login required }
        "500": { description: Import failed and was rolled back }
  /admin/supplier-taxonomy/legacy-review:
    get:
      operationId: listAdminSupplierTaxonomyLegacyReview
      tags: [admin]
      responses:
        "200":
          description: Legacy item leaves and exact-name-only suggestions, with group headings excluded
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierTaxonomyLegacyReview" }
        "401": { description: Admin login required }
  /admin/supplier-taxonomy/legacy-review/{legacyId}/apply:
    post:
      operationId: applyAdminSupplierTaxonomyLegacyMapping
      tags: [admin]
      parameters:
        - in: path
          name: legacyId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierTaxonomyLegacyMappingInput" }
      responses:
        "200":
          description: Explicitly confirmed mapping and copied supplier links; legacy records remain unchanged and reviewed mappings cannot be redirected implicitly
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierTaxonomyLegacyReview" }
        "400": { description: Mapping confirmation is required }
        "401": { description: Admin login required }
        "404": { description: Legacy category or taxonomy item not found }
        "409": { description: Legacy item already maps to a different taxonomy item and requires explicit correction }
  /admin/supplier-taxonomy/export.csv:
    get:
      operationId: exportAdminSupplierTaxonomyCsv
      tags: [admin]
      responses:
        "200":
          description: Taxonomy nodes and linked suppliers as UTF-8 CSV
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Admin login required }
  /admin/item-categories/import-report:
    get:
      operationId: getAdminItemCategoryImportReport
      tags: [admin]
      responses:
        "200":
          description: Result of importing the supplied item list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCategoryImportReport" }
        "401": { description: Admin login required }
  /admin/groups:
    get:
      operationId: listAdminGroups
      tags: [admin]
      responses:
        "200":
          description: All groups, including inactive groups, for administration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { description: Admin login required }
    post:
      operationId: createAdminGroup
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { description: Invalid group data }
        "401": { description: Admin login required }
        "409": { description: Group name or slug already exists }
  /admin/groups/{id}:
    patch:
      operationId: updateAdminGroup
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdate" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { description: Invalid group data }
        "401": { description: Admin login required }
        "404": { description: Group not found }
        "409": { description: Group name or slug already exists }
    delete:
      operationId: deleteAdminGroup
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
