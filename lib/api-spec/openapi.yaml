              schema:
                $ref: "#/components/schemas/RegistrationInterestList"
        "401": { description: Admin authentication required }
  /admin/registrations/{id}/approve:
    post:
      operationId: approveRegistration
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registration approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Admin authentication required }
        "404": { description: Registration not found }
  /admin/registrations/{id}/reject:
    post:
      operationId: rejectRegistration
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registration rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401": { description: Admin authentication required }
        "404": { description: Registration not found }
  /admin/buyer-invitations:
    get:
      operationId: listBuyerInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [invited, activated, active, suspended] }
      responses:
        "200":
          description: Buyer invitations and activated accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuyerInvitation" }
        "401": { description: Admin authentication required }
    post:
      operationId: createBuyerInvitation
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInvitationInput" }
      responses:
        "201":
          description: Buyer invitation draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitation" }
        "400": { description: Invalid invitation details }
        "401": { description: Admin authentication required }
        "409": { description: Phone already has an account or invitation }
  /admin/buyer-invitations/{id}:
    patch:
      operationId: updateBuyerInvitation
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInvitationUpdate" }
      responses:
        "200":
          description: Buyer invitation updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitation" }
        "400": { description: Invalid invitation details }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Activated invitations cannot be edited }
    delete:
      operationId: deleteBuyerInvitation
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unactivated buyer invitation deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Activated invitations cannot be deleted }
  /admin/buyer-invitations/{id}/link:
    post:
      operationId: getBuyerInvitationLink
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stable invitation link and WhatsApp message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitationLink" }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Invitation already activated }
  /admin/buyer-invitations/{id}/sent:
    post:
      operationId: markBuyerInvitationSent
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: WhatsApp opening recorded (delivery is not confirmed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "401": { description: Admin authentication required }
        "404": { description: Invitation not found }
        "409": { description: Invitation already activated }
  /admin/buyer-invitations/stats:
    get:
      operationId: getBuyerInvitationStats
      tags: [admin]
      responses:
        "200":
          description: Buyer invitation, search, and contact activity statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInvitationStats" }
        "401": { description: Admin authentication required }
  /admin/buyer-invitations/export:
    get:
      operationId: exportBuyerInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [invited, activated, active, suspended] }
      responses:
        "200":
          description: Excel-compatible CSV export
          content:
            text/csv:
              schema: { type: string, format: binary }
        "401": { description: Admin authentication required }
  /admin/buyer-invitations/{id}/account-status:
    patch:
      operationId: updateInvitedBuyerAccountStatus
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInvitationAccountStatusInput" }
      responses:
        "200":
          description: Buyer account status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "400": { description: Invalid account status or suspension duration }
        "401": { description: Admin authentication required }
        "404": { description: Activated buyer invitation not found }
  /admin/invitations:
    get:
      operationId: listSupplierInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [unsent, sent, completed] }
      responses:
        "200":
          description: Supplier invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierInvitation" }
        "401": { description: Admin authentication required }
    post:
      operationId: createSupplierInvitationDraft
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInvitationDraftInput" }
      responses:
        "201":
          description: Supplier invitation draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitation" }
        "400": { description: Invalid supplier details }
        "401": { description: Admin authentication required }
  /admin/invitations/stats:
    get:
      operationId: getSupplierInvitationStats
      tags: [admin]
      responses:
        "200":
          description: Supplier invitation statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitationStats" }
        "401": { description: Admin authentication required }
  /admin/invitations/options:
    get:
      operationId: getSupplierInvitationOptions
      tags: [admin]
      responses:
        "200":
          description: City suggestions for supplier invitation forms
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitationOptions" }
        "401": { description: Admin authentication required }
  /admin/suppliers/source-stats:
    get:
      operationId: getSupplierSourceStats
      tags: [admin]
      responses:
        "200":
          description: Supplier counts by creation source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSourceStats" }
        "401": { description: Admin authentication required }
  /admin/invitations/export:
    get:
      operationId: exportSupplierInvitations
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [unsent, sent, completed] }
      responses:
        "200":
          description: Excel-compatible CSV export
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400": { description: Invalid invitation status }
        "401": { description: Admin authentication required }
  /admin/suppliers/{id}/invite:
    post:
      operationId: generateSupplierInvitation
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: New pending invitation link generated without invalidating the currently active link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvitationLink" }
        "401": { description: Admin authentication required }
        "404": { description: Supplier not found }
        "409": { description: Invitation already completed unless its latest registration request was rejected }
  /admin/suppliers/{id}/invite-sent:
    post:
      operationId: markSupplierInvitationSent
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInvitationActivationInput" }
      responses:
        "200":
          description: Pending link promoted and handoff/open queued; actual WhatsApp delivery cannot be verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "401": { description: Admin authentication required }
        "404": { description: Supplier invitation not found }
        "409": { description: "Pending token is stale or does not match, or invitation cannot be reissued" }
  /invites/{token}:
    get:
      operationId: getSupplierInvite
      tags: [invitations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Public invitation details and form options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvite" }
        "404": { description: Invitation is invalid or no longer available }
        "409": { description: Invitation already completed }
  /invites/{token}/open:
    post:
      operationId: recordSupplierInviteOpened
      tags: [invitations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Invitation open recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicSuccessResponse" }
        "404": { description: Invitation not found }
        "409": { description: Invitation already completed }
  /invites/{token}/complete:
    post:
      operationId: completeSupplierInvite
      tags: [invitations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInviteInput" }
      responses:
        "201":
          description: Supplier information submitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInviteCompletion" }
        "400": { description: Invalid supplier submission }
        "404": { description: Invitation not found }
        "409": { description: Invitation already completed }
  /supplier/activation:
    get:
      operationId: getSupplierActivation
      tags: [suppliers]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Approved supplier details for initial account activation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierActivationInfo" }
        "400": { description: Invalid activation token }
        "404": { description: "Activation link is invalid, expired, or revoked" }
        "409": { description: Supplier account is already active }
  /supplier/activation/complete:
    post:
      operationId: completeSupplierActivation
      tags: [suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierActivationInput" }
      responses:
        "200":
          description: Password set and supplier signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierActivationResult" }
        "400": { description: Password is invalid or confirmation does not match }
        "404": { description: "Activation link is invalid, expired, or revoked" }
        "409": { description: Link already used or account already active }
  /admin/supplier-requests/{id}/activation-link:
    post:
      operationId: createSupplierActivationLink
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Single-use password setup link for an approved supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierActivationLink" }
        "401": { description: Admin authentication required }
        "404": { description: Approved supplier request not found }
        "409": { description: Request is not approved or supplier already has active access }
components:
  schemas:
    CatalogBilingualNames:
      type: object
      required: [nameAr, nameEn]
      properties:
        nameAr: { type: string, minLength: 1, maxLength: 120 }
        nameEn: { type: string, minLength: 1, maxLength: 120 }
    SupplierCatalogSubtype:
      type: object
      required: [id, nameAr, nameEn, status, isApproved]
      properties:
        id: { type: integer }
        nameAr: { type: string }
        nameEn: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        isApproved: { type: boolean }
    SupplierCatalogOffer:
      type: object
      required: [id, subtypeId, price, lastUpdated, isActive, eligibilityStatus, formId, formNameAr, attributeOptionIds]
      properties:
        id: { type: integer }
        subtypeId: { type: integer }
        price: { type: ["number", "null"], minimum: 0 }
        lastUpdated: { type: string, format: date-time }
        isActive: { type: boolean }
        eligibilityStatus: { type: string, enum: [eligible, pending] }
        formId: { type: ["integer", "null"] }
        formNameAr: { type: ["string", "null"] }
        attributeOptionIds:
          type: array
          items: { type: integer }
    SupplierCatalogMaster:
      type: object
      required: [id, name, nameEn, subtypes, offers, forms, attributes]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: ["string", "null"] }
        subtypes:
          type: array
          items: { $ref: "#/components/schemas/SupplierCatalogSubtype" }
        offers:
          type: array
          items: { $ref: "#/components/schemas/SupplierCatalogOffer" }
        forms:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemForm" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemAttribute" }
    SupplierCatalogPendingSubtypeProposal:
      allOf:
        - $ref: "#/components/schemas/CatalogBilingualNames"
        - type: object
          required: [id, itemId]
          properties:
            id: { type: integer }
            itemId: { type: integer }
    SupplierCatalogPendingMasterProposal:
      allOf:
        - $ref: "#/components/schemas/CatalogBilingualNames"
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: integer }
            status: { type: string, enum: [pending, approved, rejected] }
            createdAt: { type: string, format: date-time }
    SupplierCatalog:
      type: object
      required: [profileComplete, masters, pendingProposals]
      properties:
        profileComplete:
          type: boolean
          description: True only when the supplier is active and has an active offer for an approved subtype of an active, publicly visible taxonomy item and node.
        masters:
          type: array
          items: { $ref: "#/components/schemas/SupplierCatalogMaster" }
        pendingProposals:
          type: object
          required: [subtypes, masters]
          properties:
            subtypes:
              type: array
              items: { $ref: "#/components/schemas/SupplierCatalogPendingSubtypeProposal" }
            masters:
              type: array
              items: { $ref: "#/components/schemas/SupplierCatalogPendingMasterProposal" }
    SupplierCatalogOfferInput:
      type: object
      required: [itemId, formId]
      properties:
        itemId: { type: integer, minimum: 1 }
        formId: { type: integer, minimum: 1 }
        attributeOptionIds:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        subtypeId: { type: integer, minimum: 1 }
        newSubtype: { $ref: "#/components/schemas/CatalogBilingualNames" }
        price: { type: ["number", "null"], minimum: 0 }
    CatalogItemForm:
      type: object
      required: [id, itemId, nameAr, nameEn, isActive]
      properties:
        id: { type: integer }
        itemId: { type: integer }
        nameAr: { type: string }
        nameEn: { type: string }
        isActive: { type: boolean }
    CatalogItemAttributeOption:
      type: object
      required: [id, attributeId, nameAr, nameEn, isActive]
      properties:
        id: { type: integer }
        attributeId: { type: integer }
        nameAr: { type: string }
        nameEn: { type: string }
        isActive: { type: boolean }
    CatalogItemAttribute:
      type: object
      required: [id, itemId, nameAr, nameEn, isActive, options]
      properties:
        id: { type: integer }
        itemId: { type: integer }
        nameAr: { type: string }
        nameEn: { type: string }
        isActive: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemAttributeOption" }
    CatalogItemOfferAttributeValue:
      type: object
      required: [id, attributeId, attributeNameAr, optionNameAr, optionNameEn]
      properties:
        id: { type: integer }
        attributeId: { type: integer }
        attributeNameAr: { type: string }
        optionNameAr: { type: string }
        optionNameEn: { type: string }
    CatalogItemFilterOptions:
      type: object
      required: [id, name, nameEn, forms, attributes]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: ["string", "null"] }
        forms:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemForm" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemAttribute" }
    AdminCatalogFormInput:
      allOf:
        - $ref: "#/components/schemas/CatalogBilingualNames"
    AdminCatalogAttributeInput:
      type: object
      required: [nameAr, nameEn, options]
      properties:
        nameAr: { type: string, minLength: 1, maxLength: 120 }
        nameEn: { type: string, minLength: 1, maxLength: 120 }
        options:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/CatalogBilingualNames" }
    AdminCatalogAttributeOptionsInput:
      type: object
      required: [options]
      properties:
        options:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/CatalogBilingualNames" }
    SupplierCatalogOfferPriceInput:
      type: object
      minProperties: 1
      properties:
        price: { type: ["number", "null"], minimum: 0 }
        formId: { type: integer, minimum: 1 }
        attributeOptionIds:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    SupplierCatalogOfferDeleteResponse:
      type: object
      required: [id, isActive]
      properties:
        id: { type: integer }
        isActive: { type: boolean, const: false }
    SupplierCatalogMasterProposalInput:
      $ref: "#/components/schemas/CatalogBilingualNames"
    SupplierCatalogMasterProposal:
      allOf:
        - $ref: "#/components/schemas/CatalogBilingualNames"
        - type: object
          required: [id, status]
          properties:
            id: { type: integer }
            status: { type: string, enum: [pending] }
    AdminSupplierCatalogMaster:
      type: object
      required: [id, nameAr, nameEn, categoryId, categoryName, isActive, forms, attributes]
      properties:
        id: { type: integer }
        nameAr: { type: string }
        nameEn: { type: ["string", "null"] }
        categoryId: { type: integer }
        categoryName: { type: string }
        isActive: { type: boolean }
        forms:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemForm" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemAttribute" }
    AdminSupplierCatalogMasterInput:
      allOf:
        - $ref: "#/components/schemas/CatalogBilingualNames"
        - type: object
          required: [categoryId]
          properties:
            categoryId: { type: integer, minimum: 1 }
    AdminSupplierCatalogMasterTranslationInput:
      type: object
      required: [nameEn]
      properties:
        nameEn: { type: string, minLength: 1, maxLength: 120 }
    AdminSupplierCatalogMasterTranslation:
      type: object
      required: [id, nameEn]
      properties:
        id: { type: integer }
        nameEn: { type: string }
    AdminSupplierCatalogSubtypeInput:
      allOf:
        - $ref: "#/components/schemas/CatalogBilingualNames"
        - type: object
          required: [itemId]
          properties:
            itemId: { type: integer, minimum: 1 }
    SupplierCatalogReviewInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
    SupplierCatalogReviewResponse:
      type: object
      required: [id, status, isApproved, reviewedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [approved, rejected] }
        isApproved: { type: boolean }
        reviewedAt: { type: string, format: date-time }
    SupplierCatalogMasterProposalReviewInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        categoryId: { type: integer, minimum: 1 }
    SupplierCatalogMasterProposalReviewResponse:
      type: object
      required: [id, status, itemId, categoryId, reviewedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [approved, rejected] }
        itemId: { type: ["integer", "null"] }
        categoryId: { type: ["integer", "null"] }
        reviewedAt: { type: string, format: date-time }
    AdminSupplierCatalog:
      type: object
      required: [masters, subtypes, masterProposals, stats]
      properties:
        masters:
          type: array
          items: { $ref: "#/components/schemas/AdminSupplierCatalogMaster" }
        subtypes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SupplierCatalogSubtype"
              - type: object
                required: [itemId, proposedBySupplierId, createdAt, reviewedAt]
                properties:
                  itemId: { type: integer }
                  proposedBySupplierId: { type: ["integer", "null"] }
                  createdAt: { type: string, format: date-time }
                  reviewedAt: { type: ["string", "null"], format: date-time }
        masterProposals:
          type: array
          items:
            type: object
            required: [id, nameAr, nameEn, status, supplierId, supplierName, categoryId, itemId, createdAt, reviewedAt]
            properties:
              id: { type: integer }
              nameAr: { type: string }
              nameEn: { type: string }
              status: { type: string, enum: [pending, approved, rejected] }
              supplierId: { type: integer }
              supplierName: { type: string }
              categoryId: { type: ["integer", "null"] }
              itemId: { type: ["integer", "null"] }
              createdAt: { type: string, format: date-time }
              reviewedAt: { type: ["string", "null"], format: date-time }
        stats:
          type: object
          required: [activeMasters, totalSubtypes, pendingSubtypes, pendingMasterProposals, supplierAccounts, completeSupplierProfiles, approvedSubtypes, pendingProposals]
          properties:
            activeMasters: { type: integer }
            totalSubtypes: { type: integer }
            pendingSubtypes: { type: integer }
            pendingMasterProposals: { type: integer }
            supplierAccounts: { type: integer, description: Count of supplier user accounts with active login status. }
            completeSupplierProfiles: { type: integer, description: Count of active suppliers with at least one publicly eligible catalog offer. }
            approvedSubtypes: { type: integer }
            pendingProposals: { type: integer, description: Pending subtype proposals plus pending master proposals. }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Category:
      type: object
      required: [id, name, icon, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string }
        slug: { type: string }
        productCount: { type: integer }
    Group:
      type: object
      required: [id, name, slug, icon, parentId, displayOrder, isActive, categoryCount, supplierCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        parentId: { type: ["integer", "null"], description: "Null for a root group; otherwise the parent group ID." }
        displayOrder: { type: integer }
        isActive: { type: boolean }
        categoryCount: { type: integer }
        supplierCount: { type: integer }
    GroupInput:
      type: object
      required: [name, icon, displayOrder, isActive]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, minLength: 1, maxLength: 24 }
