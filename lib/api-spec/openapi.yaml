        name: { type: string, minLength: 2, maxLength: 120 }
        whatsapp: { type: string, minLength: 10, maxLength: 24 }
        city: { type: string, minLength: 2, maxLength: 80 }
        source: { type: string, enum: [manual, whatsapp], default: manual }
    SupplierInvitationOptions:
      type: object
      required: [cities]
      properties:
        cities:
          type: array
          items: { type: string }
    SupplierSourceStats:
      type: object
      required: [manual, whatsapp, selfRegistered]
      properties:
        manual: { type: integer, minimum: 0 }
        whatsapp: { type: integer, minimum: 0 }
        selfRegistered: { type: integer, minimum: 0 }
    SupplierInvitation:
      type: object
      required: [supplierId, name, city, whatsapp, inviteSentAt, inviteOpenedAt, inviteCompletedAt, requestStatus, isActive, createdAt]
      properties:
        supplierId: { type: integer }
        name: { type: string }
        city: { type: string }
        whatsapp: { type: string }
        inviteSentAt: { type: [string, "null"] }
        inviteOpenedAt: { type: [string, "null"] }
        inviteCompletedAt: { type: [string, "null"] }
        requestStatus: { type: [string, "null"] }
        isActive: { type: boolean }
        createdAt: { type: string }
    SupplierInvitationStats:
      type: object
      required: [sent, opened, completed, responseRate]
      properties:
        sent: { type: integer }
        opened: { type: integer }
        completed: { type: integer }
        responseRate: { type: number }
    SupplierInvitationLink:
      type: object
      required: [supplierId, token, supplierName, whatsapp]
      properties:
        supplierId: { type: integer }
